<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>翻牌尋寶王｜6格版</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#e1f3ff,#f7eaff);font-family:system-ui,-apple-system,sans-serif;color:#263452}.game{width:min(92vw,490px);background:white;border-radius:25px;padding:25px;box-shadow:0 14px 40px #4d62952b;text-align:center}h1{font-size:clamp(24px,6vw,34px);margin:0 0 8px}.sub{color:#6b7280;margin:0 0 20px}.status{display:flex;justify-content:space-between;font-size:15px;margin-bottom:15px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{aspect-ratio:1;border:0;border-radius:16px;background:#dce7ff;font-size:clamp(35px,9vw,58px);cursor:pointer;touch-action:manipulation}.tile.open{background:#f2f4ff}.tile.done{background:#d9f6e9}.controls{margin-top:20px;display:grid;gap:10px}button.action{border:0;border-radius:13px;padding:15px;background:#456bd5;color:white;font-size:18px;font-weight:700;cursor:pointer}button.secondary{background:#e9edf7;color:#435273}.result{padding:20px 0}.number{font-size:100px;font-weight:900;color:#3464c7;line-height:1.3}.hidden{display:none}.hint{color:#68758c;font-size:14px;margin-top:14px}</style></head><body><main class="game"><h1>🎮 翻牌尋寶王</h1><p class="sub">找出 3 組相同圖案，完成挑戰！</p><section id="play"><div class="status"><b id="progress">配對：0 / 3</b><span id="attempts">嘗試：0 次</span></div><div class="board" id="board"></div><div class="controls"><button class="action hidden" id="continue">繼續</button><button class="action secondary" id="reset">重新開始</button></div><p class="hint" id="hint">點擊兩張卡牌進行配對</p></section><section id="success" class="result hidden"><h2>🎉 闖關成功！</h2><p>你抽到的題號是</p><div class="number" id="number"></div><button class="action" id="again">再玩一次 ↻</button></section></main><script>const icons=['🍎','⭐','🐱'];let cards=[],flipped=[],matched=[],attempts=0;const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){cards=shuffle([...icons,...icons].map((symbol,id)=>({symbol,id})));flipped=[];matched=[];attempts=0;$('play').classList.remove('hidden');$('success').classList.add('hidden');render()}function render(){$('progress').textContent=`配對：${matched.length/2} / 3`;$('attempts').textContent=`嘗試：${attempts} 次`;$('board').innerHTML='';cards.forEach((c,i)=>{const b=document.createElement('button');b.className='tile'+(matched.includes(i)?' done':flipped.includes(i)?' open':'');b.textContent=matched.includes(i)||flipped.includes(i)?c.symbol:'❓';b.setAttribute('aria-label',matched.includes(i)||flipped.includes(i)?c.symbol:'未翻開卡牌');b.onclick=()=>pick(i);$('board').appendChild(b)});$('continue').classList.toggle('hidden',flipped.length!==2);if(flipped.length===2){$('continue').textContent=cards[flipped[0]].symbol===cards[flipped[1]].symbol?'配對成功！繼續':'不相同，重新蓋牌'}}function pick(i){if(flipped.length===2||flipped.includes(i)||matched.includes(i))return;flipped.push(i);if(flipped.length===2)attempts++;render()}function proceed(){if(flipped.length!==2)return;let[a,b]=flipped;if(cards[a].symbol===cards[b].symbol){matched.push(a,b)}flipped=[];if(matched.length===6){$('play').classList.add('hidden');$('success').classList.remove('hidden');$('number').textContent=1+Math.floor(Math.random()*5)}else render()}$('continue').onclick=proceed;$('reset').onclick=start;$('again').onclick=start;start();</script></body></html>
